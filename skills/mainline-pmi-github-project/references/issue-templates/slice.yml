name: "Slice — deliverable increment"
description: "A vertical increment of an epic, small enough to land gate-green in one pass."
title: "Slice: <epic> — <increment>"
labels: ["type:slice"]
body:
  - type: input
    id: parent
    attributes:
      label: Parent epic
      description: The epic this slice belongs under (link or #number). Add it as a sub-issue too.
      placeholder: "#N"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope of this slice
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: The executable spec (scenarios / tests) that must pass.
    validations:
      required: true
  - type: checkboxes
    id: dod
    attributes:
      label: Definition of Done
      options:
        - label: Acceptance tests green
        - label: Quality gate green
