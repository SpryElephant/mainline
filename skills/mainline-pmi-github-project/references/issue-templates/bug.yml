name: "Bug — defect against a requirement"
description: "Something is broken relative to a stated requirement. A defect that cites no requirement is a missing requirement, not a bug."
title: "Bug: <summary>"
labels: ["type:bug"]
body:
  - type: input
    id: requirement
    attributes:
      label: Requirement violated
      description: The .feature file and scenario this contradicts. No requirement to cite? File a Feature instead and send it to Product.
      placeholder: "features/refund.feature — 'Refund over R$500 requires a manager PIN'"
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happens
      description: The actual behaviour, and where you saw it — environment, release, PR, alert or CI run.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps, seed data, or the failing test. "Not reliably reproducible" is a valid answer — say so.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Workaround in place
      description: Anything shipped or done to mitigate it. Leave blank if none — but say so rather than omitting it.
    validations:
      required: false
